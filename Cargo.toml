[package]
name = "blast-radius"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Predict what a code change might break: a call graph of a Rust codebase, and an AI risk report"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
# Line numbers for every parsed item (spans outside a proc macro).
proc-macro2 = { version = "1", features = ["span-locations"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# A local HTTP server that stands in for the OpenAI API in tests.
wiremock = "0.6.5"
